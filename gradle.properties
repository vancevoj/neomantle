# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# NeoForm decompiles Minecraft on first run and needs headroom.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false

# NeoForge port of Mantle; mod_version tracks the upstream Mantle version it derives from.
mod_version=1.21.0
# fork_version is THIS fork's release number; bump it every published release (1.0 -> 1.1 -> 1.2 ...).
# Final version string and jar name = <minecraft_version>-<mod_version>-v<fork_version>.
# 1.23-dev: fixes the v1.22-dev startup crash, the StringRepresentable mixin must be an INTERFACE mixin
# (StringRepresentable is an interface) and the config is now non-required so a mixin hiccup degrades gracefully.
# 1.24-dev: ItemNameIngredient.test now resolves names instead of throwing (neotinkers #5, Twilight Forest smeltery
# crash); JEI multi-recipe expansion guarded; recipe serializer network errors wrapped for clearer disconnects;
# InventoryBlock use mirrors vanilla chest. Ports upstream Mantle 1.20 fixes.
# 1.25: FULL release. Promotes the v1.21 through v1.24-dev line (JEI re-enable, Lithium FlowingFluid compat, the
# v1.22-dev StringRepresentable startup-crash fix, ItemNameIngredient smeltery crash fix, JEI/network hardening) to a
# full release. No code change over v1.24-dev; pairs with Neo Tinkers v1.29.
# 1.26-dev: syncs upstream Mantle 1.20 (through 24904f56: BlockEntityPacket, fluid models, texture maps, fluid blocks
# and container food moved into Mantle, book HTML helpers, JEI UIDs), inventory blocks drop their items (neotinkers
# #25), recipes decoded from the network no longer double register on singleplayer, quieter client packet races.
# 1.27-dev: bug fixes from official Mantle's 1.21 port that also applied here: loot injection now runs during
# the reload (was empty on first world load and stale after /reload) with main -> pool0 fallback, sponge drying
# water dupe, MetalItemObject nugget, HUD layers hidden with F1, gauge tooltip crash, escaped component arguments
# (could disconnect players), command folder fixes, book export, WrapperSlot forwarding, vanilla hearts when disabled.
fork_version=1.27-dev

# Minecraft Version Information
minecraft_version=26.3
minecraft_range=[26.3,26.4)

# NeoForge Version Information
neoforge_version=26.3.0.103
neoforge_range=[26.3.0.103,)

# Build dependencies (JEI for 26.3)
jei_version=31.17.0.113
# Oldest JEI with the API Mantle uses, declared as an optional dependency
jei_range=[31.17.0,)
