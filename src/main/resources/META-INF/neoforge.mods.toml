issueTrackerURL="https://github.com/vancevoj/Mantle/issues"
license="MIT"

[[mods]]
    modId="mantle"
    version="${version}"
    displayName="Neo Mantle"
    authors="Slime Knights, vancevoj"
    description='''
Shared code for Slime Knights mods and others. Neo Mantle is vancevoj's NeoForge 26.3 port of Slime Knights' Mantle ${mod_version}; it was inspired by their work and nearly all of the design and programming belong to them. Required by Neo Tinkers.
    '''
    displayURL="https://github.com/vancevoj/Mantle"

# Compatibility patch: tolerate duplicate serialized names in extensible enums (StringRepresentable),
# preventing crashes when another mod registers colliding enum values (e.g. Petrolpark's ItemDisplayContext).
[[mixins]]
    config="mantle.mixins.json"

[[dependencies.mantle]]
    modId="neoforge"
    type="required"
    versionRange="${neoforge_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.mantle]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.mantle]]
    modId="jei"
    type="optional"
    versionRange="${jei_range}"
    ordering="NONE"
    side="BOTH"
