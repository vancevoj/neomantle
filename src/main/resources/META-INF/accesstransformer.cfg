# Mantle -- Access Transformer (rebuilt against Minecraft 26.3 names)

# ContainerScreen
# 26.1: imageWidth/imageHeight are final constructor arguments, module screens still resize themselves
public-f net.minecraft.client.gui.screens.inventory.AbstractContainerScreen imageWidth
public-f net.minecraft.client.gui.screens.inventory.AbstractContainerScreen imageHeight
public net.minecraft.client.gui.screens.inventory.AbstractContainerScreen leftPos
public net.minecraft.client.gui.screens.inventory.AbstractContainerScreen topPos
# isHovering(Slot,DD) is private; widened so MultiModuleScreen can override and super call it
public net.minecraft.client.gui.screens.inventory.AbstractContainerScreen isHovering(Lnet/minecraft/world/inventory/Slot;DD)Z

# Slot
# Slot.x/y are public FINAL in vanilla; un-final them so module screens can reposition slots
public-f net.minecraft.world.inventory.Slot x
public-f net.minecraft.world.inventory.Slot y

# Book fonts are built on the main font's glyph provider
public net.minecraft.client.gui.Font provider

# Book structure templates
public net.minecraft.world.level.levelgen.structure.templatesystem.StructureTemplate palettes

# Loot table injections
public-f net.minecraft.world.level.storage.loot.LootPool entries

# Book export renders pages offscreen with the UI lightmap
public net.minecraft.client.renderer.GameRenderer useUiLightmap
